name: Deploy to Raspberry Pi

on:
  push:
    branches: [main]
    # The configurator site deploys on its own (pages.yml); a change only to
    # it doesn't need the Pi to restart the bot.
    paths-ignore:
      - "site/**"
      - "**.md"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -e ".[dev]"
      - run: pytest -q

  notify-pi:
    # Gated on the tests: the Pi runs them again before restarting, but there
    # is no reason to wake it for a commit that already failed here.
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Publish the deploy trigger
        # Secrets go through env rather than being pasted into the script, so
        # they are never part of the command line the runner logs.
        env:
          MQTT_BROKER: ${{ secrets.MQTT_BROKER }}
          MQTT_USERNAME: ${{ secrets.MQTT_USERNAME }}
          MQTT_PASSWORD: ${{ secrets.MQTT_PASSWORD }}
        run: |
          set -euo pipefail
          for var in MQTT_BROKER MQTT_USERNAME MQTT_PASSWORD; do
            if [ -z "${!var}" ]; then
              echo "::error::Repository secret $var is not set"
              exit 1
            fi
          done
          sudo apt-get update -qq
          sudo apt-get install -y -qq mosquitto-clients
          mosquitto_pub \
            -h "$MQTT_BROKER" \
            -p 8883 \
            -t "avwx/deploy" \
            -m "${{ github.sha }}" \
            -u "$MQTT_USERNAME" \
            -P "$MQTT_PASSWORD" \
            --capath /etc/ssl/certs/
          echo "Told the Pi to deploy ${{ github.sha }}"
