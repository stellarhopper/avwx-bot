[[performance]]
name = "takeoff"
conditions = "Hard surface, flaps 20°, standard temperature"
units = "ft"
axes = ["weight_lb", "headwind_kt", "pressure_alt_ft"]
[performance.breakpoints]
weight_lb = [2000, 2400, 2800]
headwind_kt = [0, 10, 20]
pressure_alt_ft = [0, 2500, 5000, 7500]
[performance.outputs]
ground_roll = [
  [[340, 400, 470, 560], [225, 265, 315, 380], [130, 160, 195, 240]],
  [[500, 590, 700, 840], [345, 410, 490, 600], [215, 260, 320, 395]],
  [[705, 835, 1000, 1210], [500, 600, 730, 890], [325, 395, 485, 600]],
]
over_50ft = [
  [[740, 860, 1000, 1180], [530, 620, 725, 860], [350, 410, 485, 580]],
  [[1005, 1175, 1380, 1650], [745, 880, 1040, 1250], [515, 615, 735, 895]],
  [[1350, 1590, 1900, 2310], [1025, 1225, 1475, 1800], [730, 890, 1090, 1350]],
]
[[performance.corrections]]
kind = "temp_above_standard"
percent = 10
per = 25
note = "10% per 25°F above standard"
[[performance.corrections]]
kind = "grass"
percent = 7
of = "over_50ft"
note = "dry grass: add 7% of the over-50-ft figure"

[[performance]]
name = "landing"
conditions = "Hard surface, flaps 40°, power off, standard temperature, 2800 lb"
units = "ft"
axes = ["headwind_kt", "pressure_alt_ft"]
[performance.breakpoints]
