# TEST NUMBERS ONLY. NOT FOR FLIGHT.
# The tables have the shape of a 1964 Cessna 182G Owner's Manual (weight ×
# headwind × altitude at standard temperature, ending at 7,500 ft), but the
# values are made up for the tests.
tail = "N9999X"
type = "Cessna 182G"
year = 1964
fuel_type = "100LL"
equipment = ["Garmin GI 275 (x3)", "Garmin GTN 650Xi WAAS", "Garmin GFC 500 autopilot"]
notes = "Test aircraft."
service_ceiling_ft = 18900
default_power_pct = 65

[weights]
empty_lb = 1780
empty_arm = 36.0
max_ramp_lb = 2810
max_takeoff_lb = 2800
max_landing_lb = 2800

[fuel]
