[[performance.corrections]]
kind = "temp_above_standard"
percent = 10
per = 60
[[performance.corrections]]
kind = "grass"
percent = 20
of = "over_50ft"

[[performance]]
name = "climb"
conditions = "Flaps up, full throttle, standard temperature"
units = "fpm"
axes = ["weight_lb", "pressure_alt_ft"]
[performance.breakpoints]
weight_lb = [2000, 2400, 2800]
